# Used through WESTON_CONFIG_FILE by stage3/weston-wrapper. WSLg's own /home/wslg/.config/weston.ini, plus [rdprail].
[xwayland]
disable_access_control=true

[input-method]
allow-any-client=true
path=

[rdprail]
# graphics redirection through shared memory: what msrdc expects (needs gfxredir in FreeRDP and
# WSL2_SHARED_MEMORY_MOUNT_POINT in the environment, which WSLGd provides)
use-shared-memory=true

[core]
# RAIL has no desktop of its own to blank or lock (Windows does that). After the idle timeout (300 s by default)
# desktop-shell fades a black curtain over all monitors and locks; the next mouse move then crashed Weston in
# unlock() (weston_desktop_shell_send_prepare_lock_surface). 0 turns the idle timeout off.
idle-time=0

[shell]
# At start desktop-shell puts a black curtain, which captures input, over all monitors until the desktop-shell
# client says it is ready (a 15 s timer fades it in when nothing does). A click on it crashed Weston in
# activate_binding(): the fade curtain shares black_surface_committed with the fullscreen background, so it was
# taken for one and its private data (the shell) for a view. "none" does not create the curtain.
startup-animation=none
