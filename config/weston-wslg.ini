# Used through WESTON_CONFIG_FILE by stage3/weston-wrapper. WSLg's own /home/wslg/.config/weston.ini, plus [rdprail].
[xwayland]
disable_access_control=true

[input-method]
allow-any-client=true
path=

[rdprail]
# graphics redirection through shared memory: what msrdc expects (needs gfxredir in FreeRDP and
# WSL2_SHARED_MEMORY_MOUNT_POINT in the environment, which WSLGd provides)
use-shared-memory=true
